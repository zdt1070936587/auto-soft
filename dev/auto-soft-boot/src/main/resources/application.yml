spring:
  application:
    name: auto-soft
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      request-timeout: 300000

server:
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

autosoft:
  api-prefix: /api
  auth:
    register-enabled: false
  jwt:
    secret: "dev-only-change-me-32bytes-min-secret!"
    expire-seconds: 28800
    issuer: auto-soft
  crypto:
    aes-key: "dev-only-aes-key-change-me-please!"
  opencode:
    base-url: "https://opencode.ai/zen/go/v1"
    timeout-seconds: 120
  upload:
    dir: "./data/studio-uploads"

warm-flow:
  enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
