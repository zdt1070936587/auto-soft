spring:
  application:
    name: auto-soft
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      request-timeout: 300000

server:
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

autosoft:
  api-prefix: /api
  auth:
    register-enabled: false
  jwt:
    secret: "dev-only-change-me-32bytes-min-secret!"
    expire-seconds: 28800
    issuer: auto-soft
  crypto:
    aes-key: "dev-only-aes-key-change-me-please!"
  opencode:
    base-url: "https://opencode.ai/zen/go/v1"
    timeout-seconds: 120
  upload:
    dir: "./data/studio-uploads"
  workflow:
    http:
      allowed-hosts: []
    schedule:
      min-interval-ms: 300000
  assistant:
    action:
      action-draft-ttl-minutes: 30
      capability-ambiguous-score-gap: 15
    memory:
      enabled: true
      embedding-model: text-embedding-3-small
      embedding-dimensions: 1536
      inject-max-chars: 4500
      episode-importance-default: 5
      recall-top-k: 3
      consolidation:
        enabled: true
        cron: "0 0 2 * * ?"
        decay-full-days: 7
        decay-summary-days: 90
        oper-cluster-padding-minutes: 30
        batch-size: 50
  telemetry:
    page-visit:
      enabled: true
      retention-days: 90
      retention-cron: "0 30 3 * * ?"
      max-batch-size: 50
      dedupe-window-seconds: 60

warm-flow:
  enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
