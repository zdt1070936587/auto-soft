services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autosoft-postgres
    environment:
      POSTGRES_DB: autosoft
      POSTGRES_USER: dafu
      POSTGRES_PASSWORD: 123456
    ports:
      - "15432:5432"
    volumes:
      - autosoft-pg-data:/var/lib/postgresql/data
volumes:
  autosoft-pg-data:
